[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# The real database URL is loaded by alembic/env.py from app.core.config.settings,
# so this value is unused. We keep a harmless placeholder here only to satisfy
# Alembic's ini schema — leaving it empty would cause a KeyError. Do NOT put
# the real URL here, because ConfigParser performs %-interpolation on this
# value and URL-encoded passwords (e.g. ``%40``) would crash it.
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
